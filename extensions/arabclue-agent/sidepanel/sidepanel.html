<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://localhost:3000 http://127.0.0.1:3000; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" />
    <title>ArabClue Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <header class="hero">
        <div class="orb" id="orb" aria-hidden="true"></div>
        <div class="hero-copy">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="appTitle"></h1>
          <p class="sub" id="appSubtitle"></p>
        </div>
      </header>

      <section class="conn-strip" id="connStrip" aria-live="polite">
        <span class="conn-dot" id="connDot"></span>
        <span id="connOnlineLabel"></span>
        <span class="sep">·</span>
        <span id="connAuthLabel"></span>
        <span class="sep">·</span>
        <span id="connVersion"></span>
        <button class="btn tiny ghost hidden" id="btnConnect" type="button"></button>
      </section>

      <section class="panel status">
        <div class="pulse" id="pulse"></div>
        <div class="status-copy">
          <strong id="statusTitle"></strong>
          <p id="statusText"></p>
        </div>
      </section>

      <nav class="top-nav" id="topNav" role="tablist">
        <button class="nav-btn active" data-view="dashboard" id="navDashboard" type="button"></button>
        <button class="nav-btn" data-view="capture" id="navCapture" type="button"></button>
        <button class="nav-btn" data-view="copilot" id="navCopilot" type="button"></button>
        <button class="nav-btn" data-view="criteria" id="navCriteria" type="button"></button>
        <button class="nav-btn" data-view="downloads" id="navDownloads" type="button"></button>
        <button class="nav-btn" data-view="settings" id="navSettings" type="button"></button>
      </nav>

      <!-- Dashboard -->
      <div class="view" id="view-dashboard">
        <section class="scan-controls">
          <button class="btn primary" id="btnScan" type="button"></button>
          <button class="btn primary hidden" id="btnStop" type="button"></button>
          <button class="btn ghost" id="btnExtract" type="button"></button>
          <div class="stats" id="stats"></div>
        </section>

        <section class="tender-list" id="tenderList"></section>

        <section class="panel queue hidden" id="queuePanel">
          <div class="meta"><span id="queueLabel"></span></div>
          <button class="btn tiny" id="btnFlush" type="button"></button>
        </section>

        <button class="btn ghost mc-btn" id="btnMissionControl" type="button"></button>
      </div>

      <!-- Capture -->
      <div class="view hidden" id="view-capture">
        <h2 id="captureTitle"></h2>
        <p class="hint" id="captureHint"></p>
        <div class="capture-grid">
          <button class="btn primary" id="btnCapturePage" type="button"></button>
          <button class="btn" id="btnCaptureSelection" type="button"></button>
          <button class="btn" id="btnCaptureScreenshot" type="button"></button>
          <button class="btn ghost" id="btnGrantHost" type="button"></button>
        </div>
        <p class="hint" id="captureStatus"></p>
      </div>

      <!-- Copilot -->
      <div class="view hidden" id="view-copilot">
        <h2 id="copilotTitle"></h2>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" type="text" autocomplete="off" />
          <button class="btn primary" id="btnChatSend" type="submit"></button>
        </form>
        <a class="mission-link hidden" id="missionLink" href="#" target="_blank" rel="noopener"></a>
      </div>

      <!-- Tender Detail -->
      <div class="view hidden" id="view-detail">
        <button class="btn-back" id="btnBack" type="button"></button>
        <div id="detailContent"></div>
      </div>

      <!-- Criteria -->
      <div class="view hidden" id="view-criteria">
        <button class="btn-back" id="btnBackCriteria" type="button"></button>
        <h2 id="criteriaHeading"></h2>
        <form id="criteriaForm">
          <div class="field">
            <span class="label" id="labelCategories"></span>
            <div class="chips" id="categoryChips"></div>
          </div>
          <label id="labelKeywords">
            <span></span>
            <input id="critKeywords" type="text" />
          </label>
          <label id="labelKeywordsAr">
            <span></span>
            <input id="critKeywordsAr" type="text" />
          </label>
          <label id="labelMinValue">
            <span></span>
            <input id="critMinValue" type="number" />
          </label>
          <label id="labelMaxValue">
            <span></span>
            <input id="critMaxValue" type="number" />
          </label>
          <label id="labelMaxDays">
            <span></span>
            <input id="critMaxDays" type="number" />
          </label>
          <label class="checkbox" id="labelAutoDownload">
            <input id="critAutoDownload" type="checkbox" />
            <span></span>
          </label>
          <label class="checkbox" id="labelAutoProposal">
            <input id="critAutoProposal" type="checkbox" />
            <span></span>
          </label>
          <button class="btn primary" id="btnSaveCriteria" type="button"></button>
        </form>
      </div>

      <!-- Downloads -->
      <div class="view hidden" id="view-downloads">
        <button class="btn-back" id="btnBackDownloads" type="button"></button>
        <h2 id="downloadsHeading"></h2>
        <div id="downloadsList"></div>
      </div>

      <!-- Settings -->
      <div class="view hidden" id="view-settings">
        <button class="btn-back" id="btnBackSettings" type="button"></button>
        <h2 id="settingsHeading"></h2>
        <form id="settingsForm">
          <label id="labelApiBase">
            <span></span>
            <input id="settApiBase" type="url" placeholder="https://arabclue.com" />
          </label>
          <label id="labelAutoScan">
            <span></span>
            <input id="settAutoScan" type="number" />
          </label>
          <label class="checkbox" id="labelNotify">
            <input id="settNotify" type="checkbox" />
            <span></span>
          </label>
          <label id="labelLocale">
            <span></span>
            <select id="settLocale">
              <option value="ar">العربية</option>
              <option value="en">English</option>
            </select>
          </label>
          <label id="labelTheme">
            <span></span>
            <select id="settTheme">
              <option value="dark" id="optThemeDark"></option>
              <option value="light" id="optThemeLight"></option>
              <option value="system" id="optThemeSystem"></option>
            </select>
          </label>
          <button class="btn primary" id="btnSaveSettings" type="button"></button>
          <button class="btn ghost" id="btnSyncConfig" type="button"></button>
        </form>
      </div>

      <footer>
        <span id="footerBrand"></span>
        <span id="version"></span>
      </footer>
    </div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" />
    <title>ArabClue Etimad Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <header class="hero">
        <div class="orb" id="orb"></div>
        <div class="hero-copy">
          <p class="eyebrow">ArabClue · اعتماد</p>
          <h1 id="appTitle">وكيل اعتماد</h1>
          <p class="sub" id="appSubtitle">اكتشاف ذكي للمناقصات وأتمتة إعداد العروض</p>
        </div>
      </header>

      <!-- Status Panel -->
      <section class="panel status">
        <div class="pulse" id="pulse"></div>
        <div class="status-copy">
          <strong id="statusTitle">جاهز</strong>
          <p id="statusText">حدد المعايير وابدأ الفحص</p>
        </div>
      </section>

      <!-- Dashboard View -->
      <div class="view" id="view-dashboard">
        <section class="scan-controls">
          <button class="btn primary" id="btnScan">فحص اعتماد</button>
          <button class="btn primary hidden" id="btnStop">إيقاف الفحص</button>
          <div class="stats" id="stats"></div>
        </section>

        <section class="tender-list" id="tenderList">
          <p class="empty">لا توجد مناقصات مطابقة. حدد المعايير وابدأ الفحص.</p>
        </section>

        <section class="panel queue" id="queuePanel" hidden>
          <div class="meta"><span id="queueLabel">التقاطات في الانتظار</span></div>
          <button class="btn tiny" id="btnFlush">إعادة المحاولة</button>
        </section>

        <nav class="bottom-nav">
          <button class="nav-btn" id="btnCriteria" title="معايير المطابقة">⚙️ معايير</button>
          <button class="nav-btn" id="btnDownloads" title="التنزيلات">📥 تنزيلات</button>
          <button class="nav-btn" id="btnSettings" title="الإعدادات">🔧 إعدادات</button>
          <button class="nav-btn" id="btnMissionControl" title="Mission Control">🚀 MC</button>
        </nav>
      </div>

      <!-- Tender Detail View -->
      <div class="view hidden" id="view-detail">
        <button class="btn-back" id="btnBack">← رجوع</button>
        <div id="detailContent"></div>
      </div>

      <!-- Criteria View -->
      <div class="view hidden" id="view-criteria">
        <button class="btn-back" id="btnBackCriteria" onclick="document.getElementById('view-criteria').classList.add('hidden');document.getElementById('view-dashboard').classList.remove('hidden')">← رجوع</button>
        <h2>معايير المطابقة</h2>
        <form id="criteriaForm" onsubmit="return false">
          <label>كلمات مفتاحية (إنجليزي)
            <input id="critKeywords" type="text" placeholder="cloud, IT, software" />
          </label>
          <label>كلمات مفتاحية (عربي)
            <input id="critKeywordsAr" type="text" placeholder="تقنية, برمجيات, سحابي" />
          </label>
          <label>الحد الأدنى (ريال)
            <input id="critMinValue" type="number" placeholder="100000" />
          </label>
          <label>الحد الأعلى (ريال)
            <input id="critMaxValue" type="number" placeholder="10000000" />
          </label>
          <label>أقصى أيام حتى الإغلاق
            <input id="critMaxDays" type="number" placeholder="30" />
          </label>
          <label class="checkbox">
            <input id="critAutoDownload" type="checkbox" />
            تنزيل تلقائي للمستندات
          </label>
          <label class="checkbox">
            <input id="critAutoProposal" type="checkbox" />
            بدء العرض تلقائياً
          </label>
          <button class="btn primary" id="btnSaveCriteria" type="button">حفظ المعايير</button>
        </form>
      </div>

      <!-- Downloads View -->
      <div class="view hidden" id="view-downloads">
        <button class="btn-back" onclick="document.getElementById('view-downloads').classList.add('hidden');document.getElementById('view-dashboard').classList.remove('hidden')">← رجوع</button>
        <h2>التنزيلات</h2>
        <div id="downloadsList"></div>
      </div>

      <!-- Settings View -->
      <div class="view hidden" id="view-settings">
        <button class="btn-back" onclick="document.getElementById('view-settings').classList.add('hidden');document.getElementById('view-dashboard').classList.remove('hidden')">← رجوع</button>
        <h2>الإعدادات</h2>
        <form onsubmit="return false">
          <label>API base (الأصل فقط)
            <input id="settApiBase" type="url" placeholder="https://arabclue.com" />
          </label>
          <label>فحص تلقائي (دقائق، 0 = يدوي)
            <input id="settAutoScan" type="number" placeholder="30" />
          </label>
          <label class="checkbox">
            <input id="settNotify" type="checkbox" checked />
            إشعار عند وجود مطابقات جديدة
          </label>
          <label>اللغة
            <select id="settLocale">
              <option value="ar">العربية</option>
              <option value="en">English</option>
            </select>
          </label>
          <button class="btn primary" id="btnSaveSettings" type="button">حفظ</button>
        </form>
      </div>

      <footer>
        <span>ArabClue Etimad Agent</span>
        <span id="version"></span>
      </footer>
    </div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>

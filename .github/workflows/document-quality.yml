name: Document quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-two:
    name: Document generation coverage (85%+)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run document quality gate
        run: bun run quality:documents

      - name: Upload document coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-coverage
          path: coverage/documents/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  application:
    name: Full application gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --prod

      # Repo scope only: checks that depend on the checkout (tracked secrets,
      # embedded role credentials, schema-mutating build/dev/start scripts).
      # The full `deploy:safety` gate additionally asserts runtime environment
      # variables and Git history, which belong to a pre-deploy step.
      - name: Deployment safety gate (repo scope)
        run: bun run deploy:safety:repo

      # Static production-integrity scan: fabricated fallback data, orphaned
      # capabilities, unreachable declared capabilities. The script existed but
      # was unrunnable (tsx shebang, tsx not a dependency) so had never run.
      - name: Production integrity scan
        run: bun run scan:integrity

      - name: Validate Prisma schema without changing a database
        env:
          DATABASE_URL: postgresql://quality:quality@localhost:5432/quality
        run: bunx prisma validate

      - name: Lint
        run: bun run lint

      - name: Run full offline test suite
        env:
          CI: "1"
          PLAYWRIGHT_CHROMIUM: "0"
          TZ: UTC
        run: bun run test

      - name: Production build
        env:
          DATABASE_URL: postgresql://quality:quality@localhost:5432/quality
        run: bun run build

  # Full deployment safety gate (environment + Git history scopes) on pushes to
  # main. The repo-scope gate above runs on every PR; this job additionally
  # asserts the production runtime variables (REDIS_URL, BLOB_READ_WRITE_TOKEN,
  # CRON_SECRET) by pulling them from the linked Vercel project, and scans the
  # complete history for sensitive environment files. Every step is skipped
  # (job still reports success) until the VERCEL_TOKEN secret exists; set
  # VERCEL_ORG_ID and VERCEL_PROJECT_ID alongside it so `vercel env pull` can
  # address the project without a committed .vercel/ directory.
  deploy-safety:
    name: Deployment safety gate (deploy scope)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Explain the skip
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret is not configured; the deploy-scope safety gate did not run."

      - name: Check out repository (full history for the secret scan)
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        if: env.VERCEL_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        if: env.VERCEL_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Pull the production environment from Vercel
        if: env.VERCEL_TOKEN != ''
        run: >-
          bunx vercel@latest env pull .env.deploy-safety
          --environment=production --yes --token="$VERCEL_TOKEN"

      - name: Deployment safety gate (deploy scope)
        if: env.VERCEL_TOKEN != ''
        run: |
          set -a
          . ./.env.deploy-safety
          set +a
          rm -f .env.deploy-safety
          bun run deploy:safety

      - name: Remove the pulled environment file
        if: always() && env.VERCEL_TOKEN != ''
        run: rm -f .env.deploy-safety

  live-document-rendering:
    name: Live Chromium PDF, visual, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run live PDF and visual gates
        env:
          CI: "1"
          PLAYWRIGHT_CHROMIUM: "1"
          UPDATE_BILINGUAL_VISUAL_BASELINE: "0"
          TZ: UTC
        run: >-
          bun test
          src/lib/__tests__/bilingual-pdf.test.ts
          src/lib/__tests__/bilingual-visual.test.ts
          src/lib/__tests__/bilingual-performance.test.ts
          src/lib/__tests__/pdf-generation.test.ts
          src/lib/__tests__/contract-export-bilingual.test.ts
          src/lib/__tests__/proposal-layout-export.test.ts
          src/lib/__tests__/business-profile-bilingual.test.ts
          --timeout=180000

      - name: Upload bilingual visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-visual-diagnostics
          path: coverage/bilingual-visual/
          if-no-files-found: ignore
          retention-days: 14

  browser-matrix:
    name: Chromium, Firefox, and WebKit compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run bilingual browser matrix
        run: bun run test:bilingual:browsers
